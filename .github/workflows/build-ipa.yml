name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-ipa-${{ github.ref_type == 'tag' && format('tag-{0}', github.ref) || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NIGHTLY_TOOLCHAIN: nightly-2026-08-17

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '26.3'

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Checkout repository with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.95"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install Rust nightly with rust-src
        run: rustup toolchain install "$NIGHTLY_TOOLCHAIN" --profile minimal --component rust-src

      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anki-bridge-rs/target
            anki-upstream/out
          key: ${{ runner.os }}-rust-1.95-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.95-

      - name: Install Homebrew dependencies
        run: |
          brew install protobuf swift-protobuf

      - name: Install mise tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Build Rust XCFramework
        run: |
          chmod +x ./scripts/build-xcframework.sh
          ./scripts/build-xcframework.sh

      - name: Generate Swift protobuf types
        run: |
          chmod +x ./scripts/generate-protos.sh
          ./scripts/generate-protos.sh

      - name: Generate Xcode project
        run: |
          cd AmgiApp && xcodegen generate
          mkdir -p AmgiApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved AmgiApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          echo "=== Files in AmgiApp/ ==="
          ls -la ../AmgiApp/

      - name: Build Debug Simulator (Compatibility Smoke Check)
        run: |
          set -o pipefail
          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData"
          if xcodebuild -list -project AmgiApp/AmgiApp.xcodeproj | grep -q "Tests"; then
            xcodebuild build-for-testing \
              -project AmgiApp/AmgiApp.xcodeproj \
              -scheme AmgiApp \
              -configuration Debug \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -disableAutomaticPackageResolution \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              2>&1 | tee simulator-build.log
          else
            xcodebuild build \
              -project AmgiApp/AmgiApp.xcodeproj \
              -scheme AmgiApp \
              -configuration Debug \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -disableAutomaticPackageResolution \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              2>&1 | tee simulator-build.log
          fi

      - name: Build unsigned xcarchive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AmgiApp/AmgiApp.xcodeproj \
            -scheme AmgiApp \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/AmgiApp.xcarchive" \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee build.log

          if [ ! -d "$RUNNER_TEMP/AmgiApp.xcarchive" ]; then
            echo "Archive output not found at $RUNNER_TEMP/AmgiApp.xcarchive"
            exit 1
          fi
          echo "Archive build successful."

      - name: Package .app into unsigned .ipa
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/AmgiApp.xcarchive"

          echo "=== Archive contents ==="
          find "$ARCHIVE_PATH" -maxdepth 3 | head -30

          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -name "*.app" | head -1)
          echo "Found app: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            exit 1
          fi

          mkdir -p /tmp/Payload
          cp -r "$APP_PATH" /tmp/Payload/

          cd /tmp
          zip -r AmgiApp-unsigned.ipa Payload

          echo "=== IPA created ==="
          ls -lh /tmp/AmgiApp-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AmgiApp-unsigned-ipa
          path: /tmp/AmgiApp-unsigned.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Generate Build Summary
        if: always()
        run: |
          IPA_PATH="/tmp/AmgiApp-unsigned.ipa"
          {
            echo "# Amgi iOS IPA Build Summary"
            echo ""
            echo "**Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "**Commit**: \`${GITHUB_SHA}\`"
            echo "**Branch / Ref**: \`${GITHUB_REF_NAME}\`"
            echo "**IPA File**: AmgiApp-unsigned.ipa"
            if [ -f "$IPA_PATH" ]; then
              IPA_SIZE=$(ls -lh "$IPA_PATH" | awk '{print $5}')
              IPA_SHA256=$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')
              echo "**IPA Size**: $IPA_SIZE"
              echo "**IPA SHA256**: \`$IPA_SHA256\`"
            else
              echo "**IPA Size**: N/A (IPA not generated)"
              echo "**IPA SHA256**: N/A"
            fi
          } > build-summary.md

          if [ -f build.log ]; then
            {
              echo ""
              echo "## Compile Log Tail"
              echo '```'
              tail -20 build.log
              echo '```'
            } >> build-summary.md
          fi

          cat build-summary.md

      - name: Upload Build Summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-summary
          path: build-summary.md
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download unsigned IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: AmgiApp-unsigned-ipa
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/AmgiApp-unsigned.ipa

      - name: Compose release notes from the tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          IPA_SHA256=$(sha256sum dist/AmgiApp-unsigned.ipa | awk '{print $1}')
          cat >> release-notes.md <<NOTES

          ---

          Unsigned iOS IPA build. Sign locally with [AltStore](https://altstore.io/) or [Sideloadly](https://sideloadly.io/) using your own Apple ID.

          ### Install

          1. Download \`AmgiApp-unsigned.ipa\` from this release.
          2. Open AltStore or Sideloadly on your computer.
          3. Drag the IPA into the tool and sign with your Apple ID.
          4. Install on your device.

          Free Apple IDs: install lasts 7 days. Paid Apple Developer Program: 1 year.

          ### Verify

          \`\`\`
          shasum -a 256 AmgiApp-unsigned.ipa
          gh attestation verify AmgiApp-unsigned.ipa --repo ${GITHUB_REPOSITORY}
          \`\`\`

          Expected SHA256: \`${IPA_SHA256}\`

          ### License

          Amgi is licensed under [AGPL-3.0](https://www.gnu.org/licenses/agpl-3.0.html).
          It includes the [ankitects/anki](https://github.com/ankitects/anki) Rust backend (also AGPL-3.0).

          Source: https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}
          NOTES

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: dist/AmgiApp-unsigned.ipa
          body_path: release-notes.md
